server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true        # http://localhost:8080/h2-console
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: none       # 由 schema.sql 建表，不讓 Hibernate 自動建
    show-sql: true
    open-in-view: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      encoding: UTF-8

coindesk:
  url: https://kengp3.github.io/blog/coindesk.json
